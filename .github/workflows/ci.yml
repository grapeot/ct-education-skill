name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  scaffold-hygiene:
    name: scaffold-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Run offline Python checks
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -e .
          python -B -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build generic frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
