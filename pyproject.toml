[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ct-education"
version = "0.1.0"
description = "Local CPU CT geometry and educational candidate viewer"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-image>=0.24,<1",
  "pydicom>=3.0,<4",
  "pylibjpeg>=2.0,<3",
  "pylibjpeg-libjpeg>=2.3,<3",
  "pillow>=11,<13",
]

[project.optional-dependencies]
video = ["playwright>=1.48,<2"]

[project.scripts]
ct-edu = "ct_education.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_education"]
